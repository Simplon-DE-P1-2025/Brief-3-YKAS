services:
  # 1. Le Serveur de Base de Donnees
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: maritime
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. L'interface visuelle
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  pg_data:
